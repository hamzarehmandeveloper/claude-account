name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build Linux release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.1

      - name: Test
        run: cargo test --locked --all-targets

      - name: Build
        run: cargo build --locked --release

      - name: Package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          archive="claude-account-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir staging
          cp target/release/claude-account README.md LICENSE staging/
          tar -C staging -czf "${archive}" .
          sha256sum "${archive}" > "${archive}.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "${VERSION}" \
            claude-account-"${VERSION}"-x86_64-unknown-linux-gnu.tar.gz \
            claude-account-"${VERSION}"-x86_64-unknown-linux-gnu.tar.gz.sha256 \
            --generate-notes \
            --title "${VERSION}"
