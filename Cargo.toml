[package]
name = "claude-account"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Linux profile switcher for multiple Claude Code accounts"
authors = ["Hamza Rehman"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/hamzarehmandeveloper/claude-account"
repository = "https://github.com/hamzarehmandeveloper/claude-account"
keywords = ["claude-code", "profiles", "account-switcher", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.19"
